version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: api
    groups:
      # The service crates only build against the aws-config and aws-smithy-*
      # releases they were cut with: bumped one at a time, the PR fails.
      aws-sdk:
        patterns:
          - aws-*
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /gruyereka-web
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: web
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        update-types:
          - minor
          - patch

name: security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # CVEs are disclosed against code nobody touched, so the scan re-runs even
    # when the repository is quiet.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    name: trivy filesystem scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: scan the dependencies and fail on actionable findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          # A CVE with no upstream fix cannot be actioned by the contributor in
          # front of it; it is reported below rather than blocking.
          ignore-unfixed: true
          exit-code: "1"
          cache: true

      - name: report every finding to code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          cache: true

      - name: upload the SARIF report
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        if: always()
        with:
          sarif_file: trivy.sarif

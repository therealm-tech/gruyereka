[package]
name = "gruyereka-api"
version = "0.1.0"
description = "Gruyereka HTTP API: cheese tastings, cheesemongers and their reviews"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aide = { version = "0.15.1", features = ["axum", "axum-json", "axum-query", "axum-multipart", "scalar", "macros"] }
anyhow = "1.0.104"
argon2 = "0.6.0"
aws-config = { version = "1.12.0", default-features = false, features = ["rustls", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1.145.0", default-features = false, features = ["rustls", "rt-tokio", "sigv4a"] }
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
deunicode = "1.6.2"
indexmap = "2.14.2"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
schemars = { version = "0.9", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "macros", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v7", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
mockall = "0.15.0"
tower = { version = "0.5.3", features = ["util"] }
